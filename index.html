<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Glassmorphic Calculator</title>
  <!-- SEO & Meta Tags -->
  <meta name="description" content="A gorgeous, premium calculator with glassmorphic styling, smooth animations, sound feedback, calculations history, and dark/light modes.">
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Local Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <!-- Dynamic background glowing blobs -->
  <div class="blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <!-- Calculator Card -->
    <div class="calculator-card" id="calculator-card">
      
      <!-- Top controls -->
      <div class="card-controls">
        <button id="theme-toggle" class="control-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
          <!-- Moon SVG (Dark mode active) -->
          <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun SVG (Light mode active) -->
          <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <button id="sound-toggle" class="control-btn" aria-label="Toggle Sound" title="Toggle Button Sound">
          <!-- Audio On SVG -->
          <svg class="icon sound-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <!-- Audio Off SVG -->
          <svg class="icon sound-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button id="history-toggle" class="control-btn" aria-label="Toggle History" title="View History">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
      </div>

      <!-- Display Screen -->
      <div class="display-container">
        <!-- Scrollable full math expression -->
        <div class="display-expression" id="display-expression"></div>
        <!-- Main current input/result -->
        <div class="display-input" id="display-input">0</div>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <!-- Row 1 -->
        <button id="key-clear" class="btn btn-functional" data-val="clear">AC</button>
        <button id="key-backspace" class="btn btn-functional" data-val="backspace" aria-label="Backspace">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button id="key-percent" class="btn btn-functional" data-val="%">%</button>
        <button id="key-divide" class="btn btn-operator" data-val="/">&divide;</button>

        <!-- Row 2 -->
        <button id="key-7" class="btn btn-number" data-val="7">7</button>
        <button id="key-8" class="btn btn-number" data-val="8">8</button>
        <button id="key-9" class="btn btn-number" data-val="9">9</button>
        <button id="key-multiply" class="btn btn-operator" data-val="*">&times;</button>

        <!-- Row 3 -->
        <button id="key-4" class="btn btn-number" data-val="4">4</button>
        <button id="key-5" class="btn btn-number" data-val="5">5</button>
        <button id="key-6" class="btn btn-number" data-val="6">6</button>
        <button id="key-subtract" class="btn btn-operator" data-val="-">&minus;</button>

        <!-- Row 4 -->
        <button id="key-1" class="btn btn-number" data-val="1">1</button>
        <button id="key-2" class="btn btn-number" data-val="2">2</button>
        <button id="key-3" class="btn btn-number" data-val="3">3</button>
        <button id="key-add" class="btn btn-operator" data-val="+">+</button>

        <!-- Row 5 -->
        <button id="key-double-zero" class="btn btn-number" data-val="00">00</button>
        <button id="key-0" class="btn btn-number" data-val="0">0</button>
        <button id="key-decimal" class="btn btn-number" data-val=".">.</button>
        <button id="key-equals" class="btn btn-equals" data-val="=">=</button>
      </div>

      <!-- History Panel (Slide out) -->
      <div class="history-panel" id="history-panel">
        <div class="history-header">
          <h3>History</h3>
          <div class="history-actions">
            <button id="clear-history" class="text-btn" title="Clear all history">Clear</button>
            <button id="close-history" class="close-btn" aria-label="Close History">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="history-list" id="history-list">
          <div class="history-empty">No calculations yet</div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
